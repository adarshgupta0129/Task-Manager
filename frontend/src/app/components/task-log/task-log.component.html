<div class="task-log-container">
  <div class="task-log-header">
    <div class="header-content">
      <h3>Task Log: {{ task.title }}</h3>
      <p>Track progress and add updates</p>
    </div>
    <button class="close-btn" (click)="close.emit()">✕</button>
  </div>

  <div class="task-log-content">
    <!-- Left Side - Add New Log -->
    <div class="log-form-section">
      <h4>Add New Log Entry</h4>
      
      <form [formGroup]="logForm" (ngSubmit)="onSubmit()" class="log-form">
        <div class="form-group">
          <label for="date">Date</label>
          <input
            type="date"
            id="date"
            formControlName="date"
            class="form-input"
            readonly
          >
        </div>

        <div class="form-group">
          <label for="progress">Progress ({{ logForm.get('progress')?.value }}%)</label>
          <div class="progress-input-container">
            <input
              type="range"
              id="progress"
              formControlName="progress"
              min="0"
              max="100"
              step="5"
              class="progress-slider"
            >
            <div class="progress-display">
              <div class="progress-bar">
                <div 
                  class="progress-fill" 
                  [style.width.%]="logForm.get('progress')?.value"
                ></div>
              </div>
              <span class="progress-text">{{ logForm.get('progress')?.value }}%</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="remarks">Remarks *</label>
          <textarea
            id="remarks"
            formControlName="remarks"
            placeholder="Enter your progress remarks..."
            rows="4"
            class="form-textarea"
            [class.error]="logForm.get('remarks')?.invalid && logForm.get('remarks')?.touched"
          ></textarea>
          <div class="error-message" *ngIf="logForm.get('remarks')?.invalid && logForm.get('remarks')?.touched">
            Remarks are required
          </div>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="logForm.invalid || isSubmitting">
          <span *ngIf="isSubmitting" class="spinner"></span>
          {{ isSubmitting ? 'Adding...' : 'Add Log Entry' }}
        </button>
      </form>
    </div>

    <!-- Right Side - Log History -->
    <div class="log-history-section">
      <h4>Log History</h4>
      
      <div class="log-list" *ngIf="taskLogs.length > 0; else noLogs">
        <div class="log-entry" *ngFor="let log of taskLogs">
          <div class="log-header">
            <div class="log-date">{{ formatDate(log.date || log.createdAt!) }}</div>
            <div class="log-progress">
              <div class="progress-circle" [class]="getProgressClass(log.progress)">
                {{ log.progress }}%
              </div>
            </div>
          </div>
          <div class="log-remarks">{{ log.remarks }}</div>
        </div>
      </div>

      <ng-template #noLogs>
        <div class="no-logs">
          <div class="no-logs-icon">📊</div>
          <p>No log entries yet</p>
          <small>Add your first progress update</small>
        </div>
      </ng-template>
    </div>
  </div>
</div>
